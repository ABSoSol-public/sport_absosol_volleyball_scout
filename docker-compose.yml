# Lokaler Entwicklungs-Stack. Es gibt bewusst KEINEN eigenen DB-Container:
# einzige Datenbank ist die MariaDB auf der Synology (Nutzerentscheidung 2026-07-28).
# Zugangsdaten kommen aus der git-ignorierten .env (SYNOLOGY_DB_*, Vorlage .env.example).

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      VOLLEYSCOUT_DATABASE_URL: mysql+pymysql://${SYNOLOGY_DB_USER}:${SYNOLOGY_DB_PASSWORD}@${SYNOLOGY_DB_HOST}:${SYNOLOGY_DB_PORT}/${SYNOLOGY_DB_NAME}?charset=utf8mb4
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
