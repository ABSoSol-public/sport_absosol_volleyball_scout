server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx' Standard-mime.types kennt .webmanifest nicht (liefert sonst
    # application/octet-stream, was manche Browser für die PWA-Installierbarkeit
    # ablehnen).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Vue-Router (History-Mode): unbekannte Pfade auf die SPA umleiten
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
