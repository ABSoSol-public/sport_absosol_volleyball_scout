name: Build & Push Container Images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          # amd64 für gängige Synology-Modelle, arm64 für kleine Modelle/Tests
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/absosol-public/sport_absosol_volleyball_scout-${{ matrix.component }}:latest
            ghcr.io/absosol-public/sport_absosol_volleyball_scout-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
